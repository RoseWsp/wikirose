<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgDecor" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#4A9EFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4A9EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="bg-p02">
    <rect x="0" y="0" width="1280" height="720" fill="#0D1117"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgDecor)"/>
  </g>

  <!-- Header -->
  <g id="p02-header">
    <rect x="60" y="40" width="4" height="36" fill="url(#accentBar)"/>
    <text x="80" y="70" font-size="36" font-weight="bold" fill="#E6EDF3" font-family="Georgia, SimSun, serif">李继刚的核心论点</text>
    <text x="80" y="100" font-size="16" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">从"嚏"字写不出来开始</text>
  </g>

  <!-- Z-pattern argument chain — 6 items in 2 rows of 3 -->
  <!-- Row 1: left to right -->
  <g id="arg-1">
    <rect x="60" y="140" width="360" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="60" y="140" width="4" height="140" rx="2" fill="#C9A96E"/>
    <use data-icon="chunk-filled/target" x="84" y="160" width="32" height="32" fill="#C9A96E"/>
    <text x="128" y="185" font-size="18" font-weight="bold" fill="#C9A96E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">能力让渡</text>
    <text x="84" y="220" font-size="15" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
      <tspan x="84" dy="0">"嚏"字写不出来</tspan>
      <tspan x="84" dy="24">技术延伸带来能力让渡</tspan>
      <tspan x="84" dy="24">过去算总账划算，但<tspan fill="#F85149">AI不同</tspan></tspan>
    </text>
  </g>

  <g id="arg-2">
    <rect x="460" y="140" width="360" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="460" y="140" width="4" height="140" rx="2" fill="#4A9EFF"/>
    <use data-icon="chunk-filled/robot" x="484" y="160" width="32" height="32" fill="#4A9EFF"/>
    <text x="528" y="185" font-size="18" font-weight="bold" fill="#4A9EFF" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">进脑子里的替代</text>
    <text x="484" y="220" font-size="15" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
      <tspan x="484" dy="0">AI不是帮手脚</tspan>
      <tspan x="484" dy="24">是进脑子里的替代</tspan>
      <tspan x="484" dy="24">拿走的是<tspan fill="#C9A96E">人与世界之间的摩擦</tspan></tspan>
    </text>
  </g>

  <g id="arg-3">
    <rect x="860" y="140" width="360" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="860" y="140" width="4" height="140" rx="2" fill="#8B5CF6"/>
    <use data-icon="chunk-filled/sparkles" x="884" y="160" width="32" height="32" fill="#8B5CF6"/>
    <text x="928" y="185" font-size="18" font-weight="bold" fill="#8B5CF6" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">系统0</text>
    <text x="884" y="220" font-size="15" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
      <tspan x="884" dy="0">在直觉（系统1）启动之前</tspan>
      <tspan x="884" dy="24">AI就已经给了答案</tspan>
      <tspan x="884" dy="24">跳过了<tspan fill="#C9A96E">思考本身</tspan></tspan>
    </text>
  </g>

  <!-- Row 2: right to left (Z-pattern) -->
  <g id="arg-4">
    <rect x="860" y="320" width="360" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="860" y="320" width="4" height="140" rx="2" fill="#C9A96E"/>
    <use data-icon="chunk-filled/shield" x="884" y="340" width="32" height="32" fill="#C9A96E"/>
    <use data-icon="chunk-filled/bolt" x="920" y="340" width="32" height="32" fill="#4A9EFF"/>
    <text x="964" y="365" font-size="18" font-weight="bold" fill="#E6EDF3" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">两种生存模式</text>
    <text x="884" y="400" font-size="15" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
      <tspan x="884" dy="0"><tspan fill="#C9A96E">钢化膜</tspan>：隔绝世界，保护自己</tspan>
      <tspan x="884" dy="24"><tspan fill="#4A9EFF">磨刀石</tspan>：用AI打磨自己</tspan>
    </text>
  </g>

  <g id="arg-5">
    <rect x="460" y="320" width="360" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="460" y="320" width="4" height="140" rx="2" fill="#3FB950"/>
    <use data-icon="chunk-filled/user" x="484" y="340" width="32" height="32" fill="#3FB950"/>
    <text x="528" y="365" font-size="18" font-weight="bold" fill="#3FB950" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">OPC的科斯定理</text>
    <text x="484" y="400" font-size="15" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
      <tspan x="484" dy="0">一人公司（OPC）</tspan>
      <tspan x="484" dy="24">管理100个agent的成本</tspan>
      <tspan x="484" dy="24">远低于管理100个人</tspan>
    </text>
  </g>

  <g id="arg-6">
    <rect x="60" y="320" width="360" height="140" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="60" y="320" width="4" height="140" rx="2" fill="#F85149"/>
    <use data-icon="chunk-filled/eye" x="84" y="340" width="32" height="32" fill="#F85149"/>
    <text x="128" y="365" font-size="18" font-weight="bold" fill="#F85149" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">黑暗森林化</text>
    <text x="84" y="400" font-size="15" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">
      <tspan x="84" dy="0">可见即可复制</tspan>
      <tspan x="84" dy="24">护城河在<tspan fill="#C9A96E">AI看不见的地方</tspan></tspan>
      <tspan x="84" dy="24">体验留下的痕迹 = 护城河</tspan>
    </text>
  </g>

  <!-- Bottom conclusion -->
  <g id="p02-conclusion">
    <rect x="60" y="510" width="1160" height="60" rx="12" fill="#161B22" stroke="#C9A96E" stroke-width="1" stroke-opacity="0.3"/>
    <use data-icon="chunk-filled/heart" x="84" y="526" width="28" height="28" fill="#C9A96E"/>
    <text x="128" y="548" font-size="20" fill="#C9A96E" font-weight="bold" font-family="Georgia, SimSun, serif">最终结论：人身上不可压缩的是体验</text>
  </g>

  <!-- Footer -->
  <g id="p02-footer">
    <text x="1200" y="690" text-anchor="end" font-size="12" fill="#484F58" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">02</text>
  </g>
</svg>
