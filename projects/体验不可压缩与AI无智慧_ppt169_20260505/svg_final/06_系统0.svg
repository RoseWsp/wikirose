    <text x="520" y="275" font-size="22" fill="#C9A96E" font-weight="bold" font-family="Georgia, SimSun, serif">人与世界之间的摩擦</text>
    <text x="520" y="305" font-size="16" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">而摩擦，是体验的前置条件</text>

    
    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#E6EDF3" x="480" y="370" font-weight="bold">系统0意味着什么？</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="480" y="415">在直觉（系统1）启动之前，AI就给了答案</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="480" y="451"><tspan>你还没来得及<tspan fill="#C9A96E">"感觉到困惑"</tspan>，答案就来了</tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="480" y="487"><tspan>困惑没了，探索没了，<tspan fill="#F85149">体验也没了</tspan></tspan>
    </text><path fill="#4A9EFF" fill-opacity="0.06" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.15" d="M490,540 H1170 A10,10 0 0 1 1180,550 V586 A10,10 0 0 1 1170,596 H490 A10,10 0 0 1 480,586 V550 A10,10 0 0 1 490,540 Z" />
    
