      <stop offset="0%" stop-color="#4A9EFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4A9EFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warmGlow3" cx="75%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </radialGradient>
  </defs>

  
  <g id="bg-p07">
    <rect x="0" y="0" width="1280" height="720" fill="#0D1117" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#coldGlow3)" />
    <rect x="0" y="0" width="1280" height="720" fill="url(#warmGlow3)" />
  </g>

  
  <g id="p07-header">
    <rect x="60" y="40" width="4" height="36" fill="#C9A96E" />
    <text x="80" y="70" font-size="36" font-weight="bold" fill="#E6EDF3" font-family="Georgia, SimSun, serif">《吞噬星空》的比喻</text>
    <text x="80" y="100" font-size="16" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">两种生命，两种命运</text>
  </g>

  
  <g id="panel-mech">
    <path fill="#161B22" stroke="#4A9EFF" stroke-width="1" stroke-opacity="0.2" d="M76,130 H584 A16,16 0 0 1 600,146 V534 A16,16 0 0 1 584,550 H76 A16,16 0 0 1 60,534 V146 A16,16 0 0 1 76,130 Z" />
