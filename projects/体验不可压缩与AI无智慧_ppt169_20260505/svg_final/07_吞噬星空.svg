    <path fill="#0D1117" stroke="#30363D" stroke-width="1" stroke-dasharray="8,4" d="M102,160 H558 A12,12 0 0 1 570,172 V308 A12,12 0 0 1 558,320 H102 A12,12 0 0 1 90,308 V172 A12,12 0 0 1 102,160 Z" />
    <text x="330" y="240" text-anchor="middle" font-size="14" fill="#484F58" font-family="Consolas, &quot;Courier New&quot;, monospace">mechanical_vs_flesh.jpg (left half)</text>

    
  <g transform="translate(90.0, 340.0) scale(2.25)" fill="#4A9EFF">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M9 0V2H13L16 8.5L13 15H3L0 8.5L3 2H7V0H9ZM4.59794 11.7384L8 12.2618L11.4021 11.7384L11.0979 9.76163L8 10.2382L4.90206 9.76163L4.59794 11.7384ZM7 6.75C7 7.44036 6.44036 8 5.75 8C5.05964 8 4.5 7.44036 4.5 6.75C4.5 6.05964 5.05964 5.5 5.75 5.5C6.44036 5.5 7 6.05964 7 6.75ZM10.25 8C10.9404 8 11.5 7.44036 11.5 6.75C11.5 6.05964 10.9404 5.5 10.25 5.5C9.55964 5.5 9 6.05964 9 6.75C9 7.44036 9.55964 8 10.25 8Z" />
  </g>
    <text x="140" y="368" font-size="28" font-weight="bold" fill="#4A9EFF" font-family="Georgia, SimSun, serif">机械族</text>

    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="90" y="410"><tspan>算力、精度、模拟、<tspan fill="#4A9EFF">无限寿命</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="90" y="442">什么都有</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="90" y="474"><tspan>但<tspan fill="#F85149" font-weight="bold">卡住了</tspan></tspan>
    </text><path fill="#F85149" fill-opacity="0.08" stroke="#F85149" stroke-width="1" stroke-opacity="0.2" d="M98,495 H562 A8,8 0 0 1 570,503 V523 A8,8 0 0 1 562,531 H98 A8,8 0 0 1 90,523 V503 A8,8 0 0 1 98,495 Z" />
    <text x="330" y="519" text-anchor="middle" font-size="16" fill="#F85149" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">永久困在原始宇宙，境界突破不了</text>
  </g>

  
  <g id="panel-flesh">
    <path fill="#161B22" stroke="#C9A96E" stroke-width="1" stroke-opacity="0.2" d="M696,130 H1204 A16,16 0 0 1 1220,146 V534 A16,16 0 0 1 1204,550 H696 A16,16 0 0 1 680,534 V146 A16,16 0 0 1 696,130 Z" />
