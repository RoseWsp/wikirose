  <g transform="translate(710.0, 340.0) scale(2.25)" fill="#C9A96E">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M15 9C15 12.866 11.866 16 8 16C4.13401 16 1 12.866 1 9C1 5.5 4 3 4 3H6V4.5C6 5.05228 6.44772 5.5 7 5.5C7.55228 5.5 8 5.05228 8 4.5V0H10C10 0 15 3 15 9ZM10 12C10 13.1046 9.10457 14 8 14C6.89543 14 6 13.1046 6 12C6 9.5 8 8 8 8C8 8 10 9.5 10 12Z" />
  </g>
    <text x="760" y="368" font-size="28" font-weight="bold" fill="#C9A96E" font-family="Georgia, SimSun, serif">血肉类生命</text>

    <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="710" y="410"><tspan>会死、会累、<tspan fill="#C9A96E">会晕眩</tspan></tspan>
      </text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="710" y="442">弱得多</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#8B949E" x="710" y="474"><tspan>但能<tspan fill="#C9A96E" font-weight="bold">感悟</tspan>法则</tspan>
    </text><path fill="#C9A96E" fill-opacity="0.08" stroke="#C9A96E" stroke-width="1" stroke-opacity="0.2" d="M718,495 H1182 A8,8 0 0 1 1190,503 V523 A8,8 0 0 1 1182,531 H718 A8,8 0 0 1 710,523 V503 A8,8 0 0 1 718,495 Z" />
    <text x="950" y="519" text-anchor="middle" font-size="16" fill="#C9A96E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">靠感悟法则走向更远的宇宙</text>
  </g>

  
  <g id="p07-banner">
    <path fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" d="M72,590 H1208 A12,12 0 0 1 1220,602 V648 A12,12 0 0 1 1208,660 H72 A12,12 0 0 1 60,648 V602 A12,12 0 0 1 72,590 Z" />
    <text x="640" y="622" text-anchor="middle" font-size="26" font-weight="bold" fill="#8B5CF6" font-family="Georgia, SimSun, serif">"感在前，悟在后"</text>
    <text x="640" y="648" text-anchor="middle" font-size="15" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">不是计算法则，不是推导法则，是用整个身心去触碰法则</text>
  </g>

  
  <g id="p07-footer">
    <text x="1200" y="690" text-anchor="end" font-size="12" fill="#484F58" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">07</text>
  </g>
