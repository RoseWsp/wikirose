<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="warmGlow" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coldGlow" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4A9EFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4A9EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="dividerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4A9EFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starField" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E6EDF3" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <g id="bg-cover">
    <rect x="0" y="0" width="1280" height="720" fill="#0D1117"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#starField)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#warmGlow)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#coldGlow)"/>

    <!-- Decorative stars -->
    <circle cx="200" cy="150" r="1.5" fill="#E6EDF3" fill-opacity="0.4"/>
    <circle cx="450" cy="100" r="1" fill="#E6EDF3" fill-opacity="0.3"/>
    <circle cx="900" cy="180" r="1.5" fill="#E6EDF3" fill-opacity="0.35"/>
    <circle cx="1050" cy="120" r="1" fill="#E6EDF3" fill-opacity="0.25"/>
    <circle cx="150" cy="400" r="1" fill="#E6EDF3" fill-opacity="0.2"/>
    <circle cx="1150" cy="350" r="1.5" fill="#E6EDF3" fill-opacity="0.3"/>
    <circle cx="700" cy="80" r="1" fill="#C9A96E" fill-opacity="0.4"/>
    <circle cx="350" cy="250" r="1" fill="#4A9EFF" fill-opacity="0.3"/>

    <!-- Decorative geometric shapes — cold side -->
    <rect x="920" y="280" width="120" height="120" rx="2" fill="none" stroke="#4A9EFF" stroke-opacity="0.08" stroke-width="1" transform="rotate(15, 980, 340)"/>
    <rect x="1020" y="200" width="80" height="80" rx="2" fill="none" stroke="#4A9EFF" stroke-opacity="0.06" stroke-width="1" transform="rotate(-10, 1060, 240)"/>

    <!-- Decorative organic shapes — warm side -->
    <circle cx="220" cy="450" r="60" fill="none" stroke="#C9A96E" stroke-opacity="0.06" stroke-width="1"/>
    <circle cx="260" cy="490" r="40" fill="none" stroke="#C9A96E" stroke-opacity="0.04" stroke-width="1"/>
  </g>

  <!-- Placeholder image area (Needs-Manual) -->
  <g id="cover-image-placeholder">
    <rect x="140" y="180" width="1000" height="360" rx="0" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="8,4"/>
    <text x="640" y="350" text-anchor="middle" font-size="16" fill="#484F58" font-family="Consolas, &quot;Courier New&quot;, monospace">cover_bg.jpg</text>
    <text x="640" y="375" text-anchor="middle" font-size="13" fill="#484F58" font-family="Consolas, &quot;Courier New&quot;, monospace">cosmic abyss silhouette</text>
  </g>

  <!-- Title group -->
  <g id="cover-title">
    <text x="640" y="340" text-anchor="middle" font-size="72" font-weight="bold" fill="url(#titleGrad)" font-family="Georgia, SimSun, serif">体验不可压缩</text>
    <text x="640" y="420" text-anchor="middle" font-size="72" font-weight="bold" fill="url(#titleGrad)" font-family="Georgia, SimSun, serif">与AI无智慧</text>
  </g>

  <!-- Subtitle -->
  <g id="cover-subtitle">
    <rect x="490" y="460" width="300" height="1" fill="url(#dividerLine)"/>
    <text x="640" y="500" text-anchor="middle" font-size="22" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">从李继刚演讲到《吞噬星空》</text>
  </g>

  <!-- Author info -->
  <g id="cover-footer">
    <use data-icon="chunk-filled/star" x="575" y="555" width="24" height="24" fill="#C9A96E" fill-opacity="0.6"/>
    <text x="640" y="575" text-anchor="middle" font-size="16" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">Rose  |  2026.05.05</text>
  </g>
</svg>
