<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="finalGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="finalColdGlow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#4A9EFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4A9EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="finalDivider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4A9EFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <g id="bg-p10">
    <rect x="0" y="0" width="1280" height="720" fill="#0D1117"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#finalGlow)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#finalColdGlow)"/>

    <!-- Stars -->
    <circle cx="180" cy="120" r="1" fill="#E6EDF3" fill-opacity="0.3"/>
    <circle cx="400" cy="80" r="1.5" fill="#E6EDF3" fill-opacity="0.25"/>
    <circle cx="850" cy="100" r="1" fill="#E6EDF3" fill-opacity="0.2"/>
    <circle cx="1100" cy="150" r="1" fill="#C9A96E" fill-opacity="0.3"/>
    <circle cx="300" cy="600" r="1" fill="#4A9EFF" fill-opacity="0.2"/>
    <circle cx="1000" cy="580" r="1.5" fill="#E6EDF3" fill-opacity="0.15"/>
  </g>

  <!-- Core proposition lines — centered, ascending weight -->
  <g id="p10-proposition">
    <text x="640" y="220" text-anchor="middle" font-size="28" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">体验不可压缩</text>
    <text x="640" y="280" text-anchor="middle" font-size="22" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">不是因为压缩方法还不够好</text>

    <rect x="340" y="320" width="600" height="2" fill="url(#finalDivider)"/>

    <text x="640" y="380" text-anchor="middle" font-size="32" font-weight="bold" fill="#C9A96E" font-family="Georgia, SimSun, serif">而是因为模拟不是发生</text>

    <rect x="340" y="420" width="600" height="2" fill="url(#finalDivider)"/>

    <text x="640" y="470" text-anchor="middle" font-size="24" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">AI站在体验的门外</text>
  </g>

  <!-- Final punch line -->
  <g id="p10-final">
    <rect x="220" y="520" width="840" height="80" rx="16" fill="#161B22" stroke="#F85149" stroke-width="1.5" stroke-opacity="0.4"/>
    <use data-icon="chunk-filled/lock-closed" x="260" y="544" width="32" height="32" fill="#F85149" fill-opacity="0.7"/>
    <text x="310" y="570" font-size="26" font-weight="bold" fill="#F85149" font-family="Georgia, SimSun, serif">门不是算力能推开的</text>
    <text x="310" y="590" font-size="18" fill="#8B949E" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">它根本不是一扇门，是两面墙</text>
  </g>

  <!-- Footer -->
  <g id="p10-footer">
    <use data-icon="chunk-filled/star" x="605" y="650" width="16" height="16" fill="#C9A96E" fill-opacity="0.4"/>
    <use data-icon="chunk-filled/fire" x="628" y="650" width="16" height="16" fill="#C9A96E" fill-opacity="0.3"/>
    <use data-icon="chunk-filled/circle-checkmark" x="651" y="650" width="16" height="16" fill="#C9A96E" fill-opacity="0.4"/>
    <text x="1200" y="690" text-anchor="end" font-size="12" fill="#484F58" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif">10</text>
  </g>
</svg>
